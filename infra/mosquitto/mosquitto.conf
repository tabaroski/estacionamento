# Configuração SÓ PARA DESENVOLVIMENTO: sem TLS e sem senha, na porta 1883.
# Em produção: TLS na porta 8883, usuário e senha por dispositivo e ACL
# (ver docs/contrato-mqtt.md, seção "Produção").
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
